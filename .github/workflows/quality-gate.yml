name: Phase 1 Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Phase 1 quality gate
        run: python scripts/quality_gate.py

      - name: Check installer syntax
        run: bash -n install.sh docs/tests/scripts/install_smoke.sh

      - name: Smoke-test zero-config Active install
        run: bash docs/tests/scripts/install_smoke.sh
