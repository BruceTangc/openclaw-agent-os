# Proactive Registry — 主动关注项清单
# 告诉 Proactive "系统目前主动关心哪些东西"。
# 注意：这不是 Scheduler，只是给模型读的候选关注源。业务关注项随用随加。

version: 1

proactive:
  # ---- 通用系统项（默认开启）----
  - id: pending-tasks
    name: 待办与承诺
    enabled: true
    priority: critical
    trigger:
      type: heartbeat
    check:
      - overdue_tasks
      - due_soon_tasks
      - waiting_confirmations

  - id: subagent-results
    name: 子 Agent 结果
    enabled: true
    priority: high
    trigger:
      type: heartbeat
    check:
      - completed
      - failed
      - blocked

  - id: failed-automation
    name: 自动任务异常
    enabled: true
    priority: high
    trigger:
      type: heartbeat
    check:
      - failed
      - missed
      - repeated_failure

  # ---- 业务主动关注项（以后按需增加，启用时填 type 与具体 check）----
  # 示例：
  # - id: singbox-subscription
  #   name: singbox 订阅状态
  #   enabled: false        # 想启用改成 true
  #   priority: high
  #   trigger:
  #     type: heartbeat     # 或 event / cron
  #   check:
  #     - subscription_failed
  #     - new_proxy_link_needed
  #
  # - id: machining-opportunities
  #   name: 机械加工报价机会
  #   enabled: false
  #   priority: normal
  #   trigger:
  #     type: heartbeat
  #   check:
  #     - new_inquiry
  #     - quotient_needs_followup
  #
  # - id: a-share-watchlist
  #   name: A股/自选异常
  #   enabled: false
  #   priority: high
  #   trigger:
  #     type: cron            # 交易时段更合适用 cron
  #     schedule: "*/30 9-15 * * 1-5"
  #   check:
  #     - position_anomaly
  #     - earnings_risk
  #     - big_move
