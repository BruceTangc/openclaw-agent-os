# Proactive Registry — 主动关注项清单
# 告诉 Proactive "系统目前主动关心哪些东西"。这不是 Scheduler，只是给模型读的候选关注源。
# 周期性确点任务用 cron；状态变化用 Event；这里是"唤醒后该关注什么"。

version: 1

proactive:
  - id: user-commitments
    name: 用户承诺
    enabled: true
    priority: critical
    trigger:
      type: heartbeat
    check:
      - followup_required
      - due_soon
      - waiting_confirmation

  - id: active-tasks
    name: 当前任务
    enabled: true
    priority: high
    trigger:
      type: heartbeat
    check:
      - in_progress
      - failed_or_interrupted
      - blocked

  - id: subagent-results
    name: 子 Agent 结果
    enabled: true
    priority: high
    trigger:
      type: heartbeat
    check:
      - completed
      - failed
      - blocked

  - id: failed-work
    name: 失败 / 异常
    enabled: true
    priority: high
    trigger:
      type: heartbeat
    check:
      - recent_failure
      - repeated_failure
      - blocked
      - obvious_risk

  # ---- 业务主动关注项（以后按需增加，启用时填 type 与具体 check）----
